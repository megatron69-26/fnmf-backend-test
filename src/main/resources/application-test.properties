# ==============================================================================
# CẤU HÌNH MÔI TRƯỜNG TEST ĐỘC LẬP CHO FNMF BACKEND (NOTE10+ / LOCAL)
# ==============================================================================

# ===== Cổng dịch vụ =====
server.port=${PORT:8083}
server.address=${SERVER_ADDRESS:127.0.0.1}
server.forward-headers-strategy=framework

# ===== Cơ sở dữ liệu PostgreSQL thử nghiệm độc lập =====
# Tuyệt đối không trỏ vào database Railway production.
# Nguyên tắc Fail-Closed: Bắt buộc cấu hình mật khẩu qua biến môi trường TEST_DATASOURCE_PASSWORD.
spring.datasource.url=${TEST_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/fnmf_test}
spring.datasource.username=${TEST_DATASOURCE_USERNAME:fnmf_test_user}
spring.datasource.password=${TEST_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== Quản lý Schema: Flyway Migration + Hibernate Validate =====
# Sử dụng Flyway để áp dụng schema có kiểm soát, ddl-auto đặt là validate để tránh tự ý thay đổi schema ngoài ý muốn.
spring.flyway.enabled=${TEST_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${TEST_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===== Bảo mật JWT (Nguyên tắc Fail-Closed) =====
# Bắt buộc cung cấp TEST_JWT_SECRET (tối thiểu 256 bits). Ứng dụng sẽ từ chối khởi động nếu thiếu secret.
jwt.secret=${TEST_JWT_SECRET}
jwt.expiration-ms=${TEST_JWT_EXPIRATION_MS:86400000}

# ===== Dịch vụ Tài chính & AI Ngoài (Không dùng secret mặc định) =====
# LƯU Ý: Môi trường test không kèm sẵn key của nhà cung cấp bên ngoài.
# Nếu biến TEST_ALPHAVANTAGE_API_KEY hoặc TEST_OPENAI_API_KEY để trống, 
# các tính năng AI & tin tức trực tuyến sẽ ở trạng thái không khả dụng (graceful degradation),
# tuyệt đối không giả lập dữ liệu AI giả.
alphavantage.api.key=${TEST_ALPHAVANTAGE_API_KEY:}
alphavantage.api.url=${TEST_ALPHAVANTAGE_API_URL:https://www.alphavantage.co/query}

openai.api.key=${TEST_OPENAI_API_KEY:}
openai.api.url=${TEST_OPENAI_API_URL:https://generativelanguage.googleapis.com/v1beta/openai/chat/completions}
openai.default-model=${TEST_OPENAI_DEFAULT_MODEL:gemini-3.6-flash}
alphavantage.news.refresh-interval-minutes=90
alphavantage.news.failure-cooldown-minutes=15
alphavantage.news.rate-limit-cooldown-minutes=1440
alphavantage.news.gemini-cooldown-minutes=10

# ===== Tắt bảng điều khiển H2 và Swagger mặc định để bảo vệ an toàn =====
spring.h2.console.enabled=false
springdoc.swagger-ui.enabled=${TEST_SWAGGER_ENABLED:false}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=${TEST_SWAGGER_ENABLED:false}
springdoc.api-docs.path=/v3/api-docs

# ===== Quản trị Actuator =====
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ===== Binance Market Data Configuration =====
market.binance.rest-base-url=${BINANCE_MARKET_REST_BASE_URL:https://data-api.binance.vision}
market.binance.secondary-rest-base-url=${BINANCE_MARKET_SECONDARY_REST_BASE_URL:https://api-gcp.binance.com}

# ===== Cổng thanh toán Sandbox nội bộ (Không liên kết tiền thật) =====
payment.provider=${PAYMENT_PROVIDER:SANDBOX_INTERNAL}
payment.vnpay.tmn-code=${VNPAY_TMN_CODE:}
payment.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
payment.vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
payment.vnpay.return-url=${VNPAY_RETURN_URL:}
payment.vnpay.exchange-rate=${PAYMENT_EXCHANGE_RATE_VND_PER_USD:25000}
