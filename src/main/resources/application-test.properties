# ===== Server Configuration for Test Environment =====
server.port=${PORT:8083}
server.forward-headers-strategy=framework

# ===== Isolated PostgreSQL Test Database Configuration =====
# Mặc định sử dụng database test riêng biệt (local hoặc Note10+), tuyệt đối không kết nối Railway Production
spring.datasource.url=${TEST_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fnmf_test}
spring.datasource.username=${TEST_DATASOURCE_USERNAME:fnmf_test_user}
spring.datasource.password=${TEST_DATASOURCE_PASSWORD:fnmf_test_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate for Test =====
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ===== JWT Security Configuration for Test =====
# Secret độc lập phục vụ test (không dùng secret của production)
jwt.secret=${TEST_JWT_SECRET:c2VjdXJlX2ZuYWZfdGVzdF9qd3Rfc2VjcmV0X2tleV9mb3Jfc3RhbmRhbG9uZV9kZXZlbG9wbWVudF9vbmx5}
jwt.expiration-ms=${TEST_JWT_EXPIRATION_MS:86400000}

# ===== External Market & AI Services Mock/Sandbox Configuration =====
alphavantage.api.key=${TEST_ALPHAVANTAGE_API_KEY:DEMO_KEY}
alphavantage.api.url=${TEST_ALPHAVANTAGE_API_URL:https://www.alphavantage.co/query}

openai.api.key=${TEST_OPENAI_API_KEY:MOCK_GEMINI_KEY}
openai.api.url=${TEST_OPENAI_API_URL:https://generativelanguage.googleapis.com/v1beta/openai/chat/completions}
openai.default-model=${TEST_OPENAI_DEFAULT_MODEL:gemini-3.6-flash}
alphavantage.news.refresh-interval-minutes=90
alphavantage.news.failure-cooldown-minutes=15
alphavantage.news.rate-limit-cooldown-minutes=1440
alphavantage.news.gemini-cooldown-minutes=10

# ===== Dev & Swagger Tools for Testing =====
spring.h2.console.enabled=false
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs

# ===== Flyway Database Migration for Test =====
spring.flyway.enabled=${TEST_FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# ===== Binance Market Data Configuration =====
market.binance.rest-base-url=${BINANCE_MARKET_REST_BASE_URL:https://data-api.binance.vision}
market.binance.secondary-rest-base-url=${BINANCE_MARKET_SECONDARY_REST_BASE_URL:https://api-gcp.binance.com}

# ===== Payment Gateway Configuration (Test Sandbox Only) =====
payment.provider=${PAYMENT_PROVIDER:SANDBOX_INTERNAL}
payment.vnpay.tmn-code=${VNPAY_TMN_CODE:}
payment.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
payment.vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
payment.vnpay.return-url=${VNPAY_RETURN_URL:}
payment.vnpay.exchange-rate=${PAYMENT_EXCHANGE_RATE_VND_PER_USD:25000}
