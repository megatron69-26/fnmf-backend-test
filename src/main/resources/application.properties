# ===== Server =====
server.port=8083
server.address=${SERVER_ADDRESS:127.0.0.1}
server.forward-headers-strategy=framework

# ===== H2 Standalone Database for 24/7 Phone Deployment =====
spring.datasource.url=jdbc:h2:file:./data/fnmf;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ===== JWT Security Configuration =====
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# ===== Alpha Vantage Financial Market Data Configuration =====
alphavantage.api.key=${ALPHAVANTAGE_API_KEY:}
alphavantage.api.url=https://www.alphavantage.co/query

# ===== LLM API Configuration =====
openai.api.key=${OPENAI_API_KEY:}
openai.api.url=https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
openai.default-model=${OPENAI_DEFAULT_MODEL:gemini-3.6-flash}
alphavantage.news.refresh-interval-minutes=90
alphavantage.news.failure-cooldown-minutes=15
alphavantage.news.rate-limit-cooldown-minutes=1440
alphavantage.news.gemini-cooldown-minutes=10

# ===== Springdoc / Swagger UI Configuration =====
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.api-docs.path=/v3/api-docs

# ===== Flyway Database Migration (Disabled for local H2, only enabled on PostgreSQL prod) =====
spring.flyway.enabled=false

# ===== H2 Web Console (Database Viewer GUI) =====
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ===== Binance Market Data Configuration =====
market.binance.rest-base-url=${BINANCE_MARKET_REST_BASE_URL:https://data-api.binance.vision}
market.binance.secondary-rest-base-url=${BINANCE_MARKET_SECONDARY_REST_BASE_URL:https://api-gcp.binance.com}

# ===== Payment Gateway Configuration =====
payment.provider=${PAYMENT_PROVIDER:SANDBOX_INTERNAL}
payment.vnpay.tmn-code=${VNPAY_TMN_CODE:}
payment.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
payment.vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
payment.vnpay.return-url=${VNPAY_RETURN_URL:}
payment.vnpay.exchange-rate=${PAYMENT_EXCHANGE_RATE_VND_PER_USD:25000}
